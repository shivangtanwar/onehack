server {
    listen 80;
    listen [::]:80;
    server_name onehack.shivang.me;
    root /var/www/onehack/current;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://ethereum-sepolia-rpc.publicnode.com https://sepolia.base.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location ~ /\. { deny all; }
    location ~* \.(?:json|html)$ { try_files $uri =404; expires -1; }
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
}
